[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxlens"
version = "0.1.0"
description = "MCP server that turns template-heavy C++ math-library headers into LLM-friendly API specs with compile-check loops"
requires-python = ">=3.10"
dependencies = ["libclang>=16", "mcp>=1.2,<2", "rank_bm25>=0.2.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
dxlens = "dxlens.cli:main"
dxlens-mcp = "dxlens.server:main"

[tool.setuptools]
packages = ["dxlens", "dxlens.eval"]

[tool.setuptools.package-data]
dxlens = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
